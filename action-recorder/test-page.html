<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Recorder — Test Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 24px; background: #f5f5f5; color: #333; }
    h1 { margin-bottom: 16px; font-size: 22px; }
    h2 { margin: 20px 0 10px; font-size: 16px; color: #555; }
    .section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 6px 0 4px; font-size: 13px; font-weight: 600; }
    input, select, textarea, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; margin-bottom: 8px; }
    button { background: #0066cc; color: #fff; cursor: pointer; border: none; font-weight: 600; }
    button:hover { background: #0055aa; }
    button.red { background: #cc3333; }
    button.red:hover { background: #aa2222; }
    #result { background: #1a1a2e; color: #0f0; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    iframe { width: 100%; height: 200px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Action Recorder — Test Page</h1>

  <div class="section">
    <h2>T1: Click Recording</h2>
    <button id="click-btn">Click Me</button>
    <div id="click-count">Clicks: 0</div>
  </div>

  <div class="section">
    <h2>T2: Input Recording + Masking</h2>
    <div class="grid">
      <div>
        <label>Password Field</label>
        <input type="password" name="password" placeholder="Enter password">
      </div>
      <div>
        <label>Email Field</label>
        <input type="email" name="email" placeholder="user@example.com">
      </div>
      <div>
        <label>API Key (sensitive)</label>
        <input type="text" name="api_key" placeholder="sk-...">
      </div>
      <div>
        <label>Normal Text</label>
        <input type="text" name="search" placeholder="Search...">
      </div>
    </div>
  </div>

  <div class="section">
    <h2>T3: Fetch Correlation</h2>
    <button id="fetch-btn" class="red">GET /api/data</button>
    <button id="fetch-post-btn" class="red">POST /api/submit</button>
    <div id="fetch-result"></div>
  </div>

  <div class="section">
    <h2>T4: XHR Correlation</h2>
    <button id="xhr-btn" class="red">XHR GET /api/xhr</button>
  </div>

  <div class="section">
    <h2>T5: Form Submit</h2>
    <form id="test-form">
      <label>Name</label>
      <input type="text" name="name" placeholder="Your name">
      <label>Email</label>
      <input type="email" name="email" placeholder="Your email">
      <button type="submit">Submit Form</button>
    </form>
  </div>

  <div class="section">
    <h2>T6: Keyboard Events</h2>
    <input type="text" id="keyboard-input" placeholder="Type here...">
  </div>

  <div class="section">
    <h2>T7: iframe Test</h2>
    <iframe src="test-iframe.html" id="test-iframe"></iframe>
  </div>

  <div class="section">
    <h2>Result Log</h2>
    <div id="result">Waiting for actions...</div>
  </div>

  <script>
    const resultEl = document.getElementById('result');
    let clickCount = 0;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      resultEl.textContent = '[' + time + '] ' + msg + '\n' + resultEl.textContent;
    }

    // T1: Click
    document.getElementById('click-btn').addEventListener('click', () => {
      clickCount++;
      document.getElementById('click-count').textContent = 'Clicks: ' + clickCount;
      log('Button clicked #' + clickCount);
    });

    // T3: Fetch
    document.getElementById('fetch-btn').addEventListener('click', async () => {
      try {
        const resp = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        const data = await resp.json();
        log('GET /api/data: ' + resp.status);
        document.getElementById('fetch-result').textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        log('GET error: ' + e.message);
      }
    });

    document.getElementById('fetch-post-btn').addEventListener('click', async () => {
      try {
        const resp = await fetch('https://jsonplaceholder.typicode.com/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'test', body: 'hello', userId: 1 })
        });
        const data = await resp.json();
        log('POST /api/submit: ' + resp.status);
        document.getElementById('fetch-result').textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        log('POST error: ' + e.message);
      }
    });

    // T4: XHR
    document.getElementById('xhr-btn').addEventListener('click', () => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/2');
      xhr.onload = () => {
        log('XHR GET: ' + xhr.status);
      };
      xhr.onerror = () => log('XHR error');
      xhr.send();
    });

    // T5: Form submit
    document.getElementById('test-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      log('Form submitted: ' + JSON.stringify(Object.fromEntries(fd)));
    });

    // T6: Keyboard
    document.getElementById('keyboard-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') log('Enter pressed in keyboard input');
    });

    // Listen for recording events
    window.addEventListener('message', (e) => {
      if (e.data && e.data.source === 'ACTION_RECORDER') {
        log('[' + e.data.type + '] ' + JSON.stringify(e.data.payload?.type || e.data.payload?.status || ''));
      }
    });
  </script>
</body>
</html>
